<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branding Explained</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--be-paper);color:var(--be-ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  a{color:var(--be-ink)}a:hover{opacity:.7}
  ::-webkit-scrollbar{height:0;width:0}
  input::placeholder{color:var(--be-ink-35)}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ArticlePage.jsx"></script>
<script type="text/babel" src="IndexPage.jsx"></script>
<script type="text/babel">
function App() {
  const [view, setView] = React.useState({ name: "home", topic: null });
  const navigate = (name, topic = null) => { setView({ name, topic }); window.scrollTo(0, 0); };
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const { Header, Footer, HomePage, ArticlePage, IndexPage, SubscribePage } = window;
  let page;
  if (view.name === "article") page = <ArticlePage onNavigate={navigate} />;
  else if (view.name === "index") page = <IndexPage topic={view.topic} onNavigate={navigate} />;
  else if (view.name === "subscribe") page = <SubscribePage onNavigate={navigate} />;
  else page = <HomePage onNavigate={navigate} />;
  return (<>
    <Header onNavigate={navigate} />
    {page}
    <Footer onNavigate={navigate} />
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
