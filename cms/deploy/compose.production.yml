# The Knowledge Hub on the Designally NAS — the Portainer stack.
#
# Nothing in this file is a secret, and nothing secret may be added to it.
# Every ${NAME} is a Portainer stack environment variable, entered there;
# docs/deploy-nas.md says what each one is and where its value comes from.
# `:?` means the stack refuses to start without it, rather than starting a
# container that fails later.
#
# IMAGE_TAG is `sha-<full 40-character commit>`, copied from the release
# workflow's run summary. There is no default and never `latest`.
services:
  app:
    image: ghcr.io/designally-co/designally-knowledge-hub:${IMAGE_TAG:?set IMAGE_TAG to sha-<full commit>}
    container_name: knowledge-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

      # The public origin. Behind Caddy the server sees itself as
      # 0.0.0.0:3000, so share cards, the sitemap, newsletter links and the
      # Google sign-in fallback all take the address from here. Not secrets.
      SITE_URL: https://hub.designally.co
      PAYLOAD_PUBLIC_SERVER_URL: https://hub.designally.co
      FRONTEND_URL: https://hub.designally.co

      # Uploads go to R2. Without this the container would save them to its own
      # disk, and the next stack update would throw them away (lib/storage).
      MEDIA_STORAGE: r2

      # The Supabase SESSION pooler (port 5432), not the transaction pooler
      # Vercel uses (6543): this server stays up and keeps its connections.
      DATABASE_URI: ${DATABASE_URI:?}
      # Copied exactly from Vercel. A new value signs everyone out and breaks
      # every unsubscribe and confirm link already sent by email.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}

      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      # Optional: the Account sheet's model setting wins; this is the fallback.
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}

      RESEND_API_KEY: ${RESEND_API_KEY:?}
      NEWSLETTER_FROM: ${NEWSLETTER_FROM:?}
      # Set, every announcement goes to this one address instead of the list.
      # Leave it empty in normal running.
      NEWSLETTER_TEST_TO: ${NEWSLETTER_TEST_TO:-}

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?}

      # Optional: extra hosts /api/media/from-url may fetch covers from.
      MEDIA_FETCH_HOSTS: ${MEDIA_FETCH_HOSTS:-}
    # No published ports: Caddy reaches knowledge-hub:3000 on caddy_default.
    networks:
      - caddy_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  caddy_default:
    external: true
