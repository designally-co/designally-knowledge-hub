# Spec: https://github.com/designally-co/designally-brain/blob/main/docs/brain-yaml.md

format_version: 1
slug: knowledge-hub
name: Knowledge Hub
kind: internal_tool
status: live

purpose: >
  A free, public library of design articles and downloadable resources. It
  builds Designally's authority, brings in organic search traffic, and grows
  the newsletter audience toward the agency's paid services.
summary: >
  One Next.js app with Payload CMS that serves both the public site and the
  admin. Editors write articles and resources in the admin, or Article Studio
  publishes finished articles through an API. Every page is in English and
  Thai, with Thai generated by Claude. Pages are statically generated, so new
  content appears within about a minute without a deploy. Publishing an article
  or resource emails confirmed newsletter subscribers once. Production runs as
  a Docker container on the Designally NAS, deployed from a release-* tag.
  The Vercel deployment is kept as the rollback.

stack:
  - Next.js
  - Payload CMS
  - PostgreSQL (Supabase)
  - Cloudflare R2
  - Resend
  - Claude API
  - Tailwind CSS
  - Docker (Designally NAS)
  - Vercel (rollback)

live_url: https://hub.designally.co
repo_url: https://github.com/designally-co/designally-knowledge-hub
supabase_project_ref: mqhrcjvaufdlmqgrbldx

features:
  - name: Articles
    description: >
      Articles with a cover image, exactly one tag, references, related
      articles (chosen by the editor, else same tag), reading time, and SEO
      fields. Draft or published.
  - name: Resources
    description: >
      Downloadable templates and assets with files, formats, licence and file
      size, grouped by resource category. All downloads are free and ungated.
  - name: Listings
    description: Home, category, tag and resource listing pages. There is no /articles index page.
  - name: Keyword search
    description: >
      Search from the site header across titles, summaries and tags. There is
      no shareable search results page.
  - name: Bilingual English and Thai
    description: >
      English is the source. Thai is generated by Claude at publish time and
      can be regenerated with a button in the admin. Thai pages live under /th.
  - name: Newsletter
    description: >
      Double opt-in sign-up with a honeypot against bots. Publishing an article
      or resource announces it to confirmed subscribers once. Every email has
      an unsubscribe link.
  - name: Publishing API for Article Studio
    description: >
      POST /api/articles/from-markdown creates an article from Markdown, and
      POST /api/media/from-url fetches a cover image from a signed URL. Both
      need a CMS user API key.
  - name: Mobile-friendly admin
    description: >
      Payload admin reworked for phones. Sign-in is Google SSO for designally.co
      accounts. Everyone who signs in is an admin; there are no roles.
  - name: Media library
    description: Uploads stored in Cloudflare R2 with card, hero and thumbnail sizes made on upload.
  - name: SEO
    description: >
      Static generation with refresh every 60 seconds, a sitemap with language
      alternates, robots.txt, JSON-LD structured data, and a real 404 page.
  - name: Page-view analytics
    description: Cloudflare Web Analytics, cookieless, on only when its token is set.
  - name: Nightly database backup
    description: >
      A GitHub Actions job dumps the database to a private R2 bucket every
      night at 02:00 Bangkok time. The same job also backs up the Survey app's
      database.

tables:
  - name: articles
    description: Articles (language-neutral fields).
    sensitive: false
  - name: articles_locales
    description: Article fields per language (en, th).
    sensitive: false
  - name: articles_references
    description: Reference links listed under an article.
    sensitive: false
  - name: articles_rels
    description: Links from an article to related articles.
    sensitive: false
  - name: resources
    description: Downloadable resources (language-neutral fields).
    sensitive: false
  - name: resources_locales
    description: Resource fields per language (en, th).
    sensitive: false
  - name: resources_files
    description: Files attached to a resource, with their format.
    sensitive: false
  - name: resource_categories
    description: Categories that group resources.
    sensitive: false
  - name: media
    description: Uploaded file records (the files themselves are in R2).
    sensitive: false
  - name: settings
    description: Site settings, such as the Claude model used for Thai translation.
    sensitive: false
  - name: subscribers
    description: Newsletter list with consent status.
    sensitive: true
  - name: users
    description: CMS accounts, including API keys for Article Studio.
    sensitive: true
  - name: users_sessions
    description: CMS login sessions.
    sensitive: true
  - name: payload_preferences
    description: Payload internal. Admin screen preferences per user.
    sensitive: false
  - name: payload_preferences_rels
    description: Payload internal. Links preferences to users.
    sensitive: false
  - name: payload_locked_documents
    description: Payload internal. Stops two people editing one document at once.
    sensitive: false
  - name: payload_locked_documents_rels
    description: Payload internal. Links locks to documents and users.
    sensitive: false
  - name: payload_kv
    description: Payload internal key-value store.
    sensitive: false
  - name: payload_migrations
    description: Payload internal. Which database migrations have run.
    sensitive: false

# "article-studio publishes_to knowledge-hub" is not listed here. It belongs
# in Article Studio's brain.yaml, because Article Studio starts it.
connections:
  - to: article-studio
    kind: shares_storage_with
    description: >
      Uses Article Studio's Cloudflare R2 bucket under the hub/ prefix and
      never touches Article Studio's files. Files are served from
      img.designally.co.

